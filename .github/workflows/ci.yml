name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The demo's `import 'media-preview-hls-iframe'` is resolved by vite's
      # dev server against the project's own package.json (name + main). dist/
      # must exist before the dev server starts, or the e2e tests get an
      # empty advanced.js and #preview.player never appears.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
